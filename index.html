<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family tree</title>

  <!-- Fonts (needs internet; the page still works without it, just with fallback fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="bar">
    <div class="heading">
      <h1 id="title"></h1>
      <p id="subtitle"></p>
    </div>
    <div class="controls">
      <button id="zoom-out" type="button"></button>
      <button id="zoom-in" type="button"></button>
      <button id="zoom-reset" type="button"></button>
    </div>
  </header>

  <!-- The scrolling area. JavaScript fills #tree with the family. -->
  <main id="viewport">
    <div id="tree" class="tree"></div>
  </main>

  <!-- The detail panel that slides in when you click a person -->
  <aside id="panel" inert></aside>

  <!-- Order matters: the data must load before the code that uses it -->
  <script src="family-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
